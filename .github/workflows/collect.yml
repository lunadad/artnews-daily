name: collect
on:
  schedule: [{ cron: '40 22 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: collect, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/collect.ts
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "chore(data): daily art news $(date -u +%F)"
          git pull --rebase --autostash
          git push
      # Runs after the push so a failure never withholds data; it only turns the
      # run red (and emails the owner) when translation or a feed silently degraded.
      - name: verify
        run: npx tsx scripts/verify-daily.ts
